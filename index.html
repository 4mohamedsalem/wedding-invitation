    <style>

        margin: 0;
        padding: 0;

      body {
        background: #c9b99b;
        overflow-x: hidden;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      .page {
        position: relative;
        width: 100%;
      }
      .page img {
        width: 100%;
        display: block;
      }
      .seal-area {
        position: absolute;
        top: 47%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 24%;
        aspect-ratio: 1;
        border-radius: 50%;
        cursor: pointer;
      }
      .gram-tap {
        position: absolute;
        top: 24%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40%;
        padding-bottom: 36%;
        cursor: pointer;
        display: block;
      }
      .p3-cd {
        position: absolute;
        top: 57%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 92%;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .cd-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: clamp(2px, 1.5vw, 8px);
      }
      .cd-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        min-width: clamp(42px, 16vw, 70px);
      }
      .cd-num {
        font-family: "Alegreya", serif;
        font-weight: 700;
        color: #555;
        font-size: clamp(2.2rem, 9.5vw, 3.2rem);
        line-height: 1;
      }
      .cd-sep {
        font-family: "Alegreya", serif;
        font-weight: 700;
        color: #555;
        font-size: clamp(2rem, 8vw, 2.8rem);
        line-height: 1;
        padding-top: 2px;
        align-self: flex-start;
      }
      .cd-lbl {
        font-size: clamp(0.55rem, 2.5vw, 0.72rem);
        letter-spacing: 0.1em;
        color: #555;
        text-transform: uppercase;
        font-family: "Tajawal", sans-serif;
      }
      .tap-maps {
        position: absolute;
        top: 21%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28%;
        padding-bottom: 14%;
        cursor: pointer;
        display: block;
      }
      .tap-cal {
        position: absolute;
        top: 44%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 28%;
        padding-bottom: 14%;
        cursor: pointer;
        display: block;
      }
      .p5-name {
        position: absolute;
        top: 36%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
      }
      .p5-msg {
        position: absolute;
        top: 67%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
      }
      .p5-inp,
      .p5-ta {
        width: 100%;
        background: rgba(255, 250, 242, 0.75);
        border: 1.5px solid #8b5e3c;
        border-radius: 10px;
        font-family: "Tajawal", sans-serif;
        font-size: clamp(0.85rem, 3.5vw, 1rem);
        color: #3a1c0c;
        padding: 10px 14px;
        outline: none;
        direction: rtl;
        -webkit-appearance: none;
      }
      .p5-inp:focus,
      .p5-ta:focus {
        border-color: #5d2c24;
        background: rgba(255, 250, 242, 0.92);
      }
      .p5-ta {
        height: clamp(80px, 18vw, 110px);
        resize: none;
      }
      .p5-btn-wrap {
        position: absolute;
        top: 87%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50%;
      }
      .p5-btn {
        width: 100%;
        background: #692219;
        color: #ede6df;
        border: none;
        border-radius: 999px;
        padding: 11px 0;
        font-family: "Tajawal", sans-serif;
        font-size: clamp(0.85rem, 3.5vw, 1rem);
        font-weight: 500;
        cursor: pointer;
      }
      .p5-ok {
        display: none;
        text-align: center;
        font-family: "Tajawal", sans-serif;
        font-size: 0.95rem;
        color: #692219;
        padding: 4px 0;
      }
      #pg1.hidden {
        display: none;
      }
      #main {
        display: none;
      }
      #main.show {
        display: block;
      }

    <script>
      var audio = document.getElementById("bgAudio");

      function startAudio() {
        if (audio) {
          audio.play().catch(function (e) {
            console.log("Audio play blocked: ", e);
          });
        }
        document.getElementById("pg1").classList.add("hidden");
        document.getElementById("main").classList.add("show");
      }

      document.querySelector(".seal-area").addEventListener("click", function () {
        startAudio();
      });

      (function () {
        var target = new Date("2026-10-15T18:00:00+02:00").getTime();
        function update() {
          var now = new Date().getTime();
          var diff = target - now;
          if (diff <= 0) {
            document.getElementById("cdD").textContent = "00";
            document.getElementById("cdH").textContent = "00";
            document.getElementById("cdM").textContent = "00";
            document.getElementById("cdS").textContent = "00";
            return;
          }
          var d = Math.floor(diff / (1000 * 60 * 60 * 24));
          var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          var s = Math.floor((diff % (1000 * 60)) / 1000);
          document.getElementById("cdD").textContent = d < 10 ? "0" + d : d;
          document.getElementById("cdH").textContent = h < 10 ? "0" + h : h;
          document.getElementById("cdM").textContent = m < 10 ? "0" + m : m;
          document.getElementById("cdS").textContent = s < 10 ? "0" + s : s;
        }
        update();
        setInterval(update, 1000);
      })();

      function sendMsg() {
        var ok = document.getElementById("p5Ok");
        ok.style.display = "block";
        setTimeout(function () {
          ok.style.display = "none";
        }, 3000);
      }
    </script>
